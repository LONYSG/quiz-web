# =============================================================================
# 문제 생성 (Track D / R011)
#
# ★★ R011부터 이것이 주 확보 경로다.
#   OpenTDB 수확·가공(pipeline-harvest / pipeline-process)은 비활성화되었다.
#
# ★★ 비밀값 취급 (절대 원칙)
#   · GEMINI_API_KEY 는 GitHub Secrets 에서만 온다. 파일에 두지 않는다
#   · 로그에 키를 찍지 않는다. 길이만 확인한다
#   · GeminiClient 가 모든 출력 텍스트를 스크럽한다 (pipeline/src/gemini.ts)
#
# ─────────────────────────────────────────────────────────────────────────────
# ★★ R012: 정기 실행(schedule)을 껐다. 수동 실행만 남긴다. 파일은 지우지 않는다.
#
#   ★ Q-71 확정 (건우 판단). 원문 취지 —
#     "퀴즈 DB는 매일 할 필요 없고 단기간에 집중해서 수천~1만 건 이상까지도 만들 수 있다.
#      ★ 시간의 흐름이 중요한 작업이 아니다.
#      회사에서 틈날 때마다 개발하는 것이라 PC는 평일 일과시간이면 계속 켜져 있다."
#
#   ★★ Actions 를 넣은 근거가 무너졌다
#     · 근거였던 것: "무료 한도가 좁아 하루에 조금씩만 되니 매일 자동으로 쌓는다"
#     · ★ R011 실측: 29회 호출 / 164,338토큰에 429 가 0회. 한도가 좁지 않았다
#     · ★ 병목은 한도가 아니라 카테고리 트리의 너비였다
#     · ★★ Claude Code 를 생성에 쓰면 Actions 는 **절반만** 할 수 있다.
#       러너에서 Claude Code 를 돌릴 수 없다. R012 비교 실험에서 Claude Code 쪽이
#       난이도·알 가치·표기 변형 모두 나았으므로, 생성을 Actions 에 맡기면
#       더 나은 쪽을 못 쓰게 된다.
#
#   ★ 지우지 않는 이유
#     429·예산 가드와 상태 파일 커밋 구조가 참조 가치가 있다.
#     ★ 그리고 나중에 "매일 조금씩" 이 다시 필요해질 수 있다.
#
#   → 로컬 대량 생성은 `npm run pipeline:bulk` 를 쓴다 (중단·재개 가능).
# ─────────────────────────────────────────────────────────────────────────────
#
# ★★ 15분 대기가 워크플로 시간 제한에 걸리는가 (작업 A 확인 사항)
#   걸리지 않는다. 근거 —
#     · GitHub 호스팅 러너의 **작업(job) 최대 실행 시간은 6시간**이다.
#       429 를 한 번 맞고 15분 대기해 1회 재개하는 최악의 경우도 1시간 미만이다
#     · 그래서 "다음 실행으로 미루는" 방식을 쓰지 않았다. 판단 근거는 이렇다 —
#       다음 실행으로 미루면 재개까지 최소 24시간(일 1회 스케줄)이 걸린다.
#       그러면 "15분 뒤에는 창이 열릴 수 있다" 는 실측 관측을 활용할 수 없다.
#   ★ timeout-minutes 를 명시해 무한 대기를 막는다.
#   ★ 확인 필요: 공개 저장소의 표준 러너 사용량 과금 정책. GitHub 정책은 바뀔 수 있다.
#     대기 15분은 러너를 점유하는 시간이므로, 유료 과금 대상이 되면 방식을 재검토해야 한다.
# =============================================================================

name: pipeline-generate

on:
  # ★★ R012: schedule 을 제거했다 (Q-71). 근거는 파일 머리말에 있다.
  #   ★ 수동 실행만 남긴다. 파일을 지우지 않는 이유도 머리말에 있다.
  workflow_dispatch:
    inputs:
      per:
        description: '중분류당 생성 건수'
        required: false
        default: '2'
      group:
        description: '한 호출에 넣을 중분류 수'
        required: false
        default: '13'
      skip:
        description: '앞의 N개 중분류를 건너뛴다'
        required: false
        default: '0'

permissions:
  contents: write

# ★ 같은 워크플로가 겹쳐 돌면 예산 상태 파일이 서로를 덮어쓴다.
#   ★ 그러면 "오늘 얼마 썼는가" 가 틀려지고 한도 관리가 무너진다.
concurrency:
  group: pipeline-generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    # ★ 429 → 15분 대기 → 1회 재개 를 포함한 최악의 경우를 넉넉히 덮는다.
    #   무한 대기를 막는 것이 목적이다.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 의존성 설치
        run: npm ci

      # ★ 컴파일 산출물을 실행한다 (docs/07-DECISIONS.md D-020)
      - name: 빌드
        run: npm run build -w shared && npm run build -w pipeline

      # ★ 키가 없으면 아무것도 하지 않고 끝낸다. 길이만 찍는다.
      #   ★ 값의 앞 4자리도 찍지 않는다 (절대 원칙 5).
      - name: 키 확인
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "${GEMINI_API_KEY}" ]; then
            echo "GEMINI_API_KEY 가 없다. 생성을 건너뛴다."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "키 길이: ${#GEMINI_API_KEY}"
          fi
        id: key

      - name: 생성
        if: steps.key.outputs.skip != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node scripts/pipeline-generate.mjs \
            --per "${{ inputs.per || '2' }}" \
            --group "${{ inputs.group || '13' }}" \
            --skip "${{ inputs.skip || '0' }}"

      - name: 샘플 시트 갱신
        if: steps.key.outputs.skip != 'true'
        run: node scripts/pipeline-samples.mjs

      # ★ 결과와 예산 상태를 커밋한다.
      #   ★ 상태 파일을 커밋해야 다음 실행이 "어제 429 를 맞았다" 를 안다.
      #     Actions 는 실행마다 새 컨테이너다.
      - name: 결과 커밋
        if: steps.key.outputs.skip != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/pipeline/processed data/pipeline/state data/pipeline/samples
          if git diff --cached --quiet; then
            echo "커밋할 변경이 없다."
          else
            git commit -m "data(pipeline): 문제 생성 결과 ($(date -u +%Y-%m-%d))"
            git push
          fi

      # ★ 자동 적재하지 않는다. 사람의 검수가 반드시 앞에 온다 (11-DEPLOY).
      - name: 안내
        if: always()
        run: |
          echo "★ 생성 결과는 검수 대기 상태다. 자동으로 게임에 들어가지 않는다."
          echo "   git pull 후 npm run pipeline:review 로 검수한다."
