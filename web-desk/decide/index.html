<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>찬종이 정할 것</title>
<style>
  :root { --bg:#f6f4ef; --card:#fff; --ink:#22201c; --sub:#6b665d; --line:#e4dfd4; --accent:#d9482b; --accent-soft:#fdeee9; --ok:#1f7a4d; }
  @media (prefers-color-scheme: dark) { :root { --bg:#191816; --card:#24221f; --ink:#f1ede4; --sub:#a8a297; --line:#3a372f; --accent:#ff7a5c; --accent-soft:#3a2420; --ok:#5fd09a; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.6 "Pretendard","Malgun Gothic",system-ui,sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 28px 16px 140px; }
  h1 { font-size: 26px; margin: 0 0 4px; }
  .lead { color: var(--sub); margin: 0 0 22px; }
  .group { margin: 30px 0 10px; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: .04em; }
  .q { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px 18px 14px; margin-bottom: 14px; }
  .q h2 { font-size: 18px; margin: 0 0 6px; }
  .q h2 .n { color: var(--accent); margin-right: 6px; }
  .why { color: var(--sub); font-size: 14.5px; margin: 0 0 12px; white-space: pre-line; }
  label.opt { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 8px; cursor: pointer; }
  label.opt:hover { border-color: var(--accent); }
  label.opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
  label.opt input { margin-top: 5px; accent-color: var(--accent); }
  .opt b { display: block; }
  .opt small { color: var(--sub); font-size: 14px; display: block; }
  .rec { display: inline-block; font-size: 12px; font-weight: 700; color: var(--accent); border: 1px solid var(--accent); border-radius: 99px; padding: 0 7px; margin-left: 6px; vertical-align: 1px; }
  textarea { width: 100%; min-height: 44px; border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; font: inherit; background: transparent; color: inherit; resize: vertical; }
  textarea:focus { outline: 2px solid var(--accent); border-color: transparent; }
  .row { display: grid; grid-template-columns: 1fr auto; gap: 6px 14px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
  .row .m b { font-size: 16px; } .row .m small { display: block; color: var(--sub); font-size: 14px; line-height: 1.5; white-space: pre-line; }
  .tag { display: inline-block; font-size: 12px; border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; margin: 2px 4px 0 0; color: var(--sub); }
  .tag.w { color: var(--accent); border-color: var(--accent); }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
  .seg label { padding: 6px 11px; font-size: 14px; cursor: pointer; white-space: nowrap; border-left: 1px solid var(--line); }
  .seg label:first-child { border-left: 0; }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg label:has(input:checked) { background: var(--accent); color: #fff; font-weight: 700; }
  .rowhead { font-size: 13px; font-weight: 700; color: var(--sub); margin: 16px 0 4px; }
  @media (max-width: 640px) { .row { grid-template-columns: 1fr; } }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line); padding: 12px 16px; }
  .bar div { max-width: 820px; margin: 0 auto; display: flex; gap: 14px; align-items: center; }
  .bar span { flex: 1; color: var(--sub); font-size: 14.5px; }
  button { font: inherit; font-weight: 700; background: var(--accent); color: #fff; border: 0; border-radius: 10px; padding: 12px 26px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .done { color: var(--ok) !important; font-weight: 700; }
  .err { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1 id="title">찬종이 정할 것</h1>
  <p class="lead" id="lead"></p>
  <div id="list"></div>
</main>
<div class="bar"><div><span id="status"></span><button id="save">저장</button></div></div>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let Q = null;

function render(saved) {
  $('#title').textContent = Q.title;
  $('#lead').textContent = Q.lead;
  let html = '', n = 0, lastGroup = null;
  for (const q of Q.questions) {
    if (q.group && q.group !== lastGroup) { html += `<div class="group">${esc(q.group)}</div>`; lastGroup = q.group; }
    n++;
    const prev = saved?.answers?.[q.key] ?? {};
    html += `<section class="q" data-key="${esc(q.key)}"><h2><span class="n">${n}</span>${esc(q.title)}</h2>`;
    if (q.why) html += `<p class="why">${esc(q.why)}</p>`;
    for (const o of q.options ?? []) {
      const checked = (prev.pick ?? q.default) === o.id ? 'checked' : '';
      html += `<label class="opt"><input type="radio" name="${esc(q.key)}" value="${esc(o.id)}" ${checked}><span><b>${esc(o.label)}${o.rec ? '<span class="rec">권장</span>' : ''}</b>${o.desc ? `<small>${esc(o.desc)}</small>` : ''}</span></label>`;
    }
    for (const r of q.rows ?? []) {
      if (r.head) { html += `<div class="rowhead">${esc(r.head)}</div>`; continue; }
      const cur = prev.rows?.[r.id] ?? r.default ?? q.rowDefault;
      html += `<div class="row" data-row="${esc(r.id)}"><div class="m"><b>${esc(r.main)}</b>${r.sub ? `<small>${esc(r.sub)}</small>` : ''}${(r.tags ?? []).map((t) => `<span class="tag ${t.startsWith('!') ? 'w' : ''}">${esc(t.replace(/^!/, ''))}</span>`).join('')}</div><div class="seg">${q.choices.map((c) => `<label><input type="radio" name="${esc(q.key)}__${esc(r.id)}" value="${esc(c.id)}" ${cur === c.id ? 'checked' : ''}>${esc(c.label)}</label>`).join('')}</div></div>`;
    }
    html += `<textarea placeholder="${esc(q.notePlaceholder ?? '덧붙일 말 (없으면 비워 두세요)')}">${esc(prev.note ?? '')}</textarea></section>`;
  }
  $('#list').innerHTML = html;
  count();
}

function collect() {
  const answers = {};
  for (const sec of document.querySelectorAll('.q')) {
    const key = sec.dataset.key;
    const q = Q.questions.find((x) => x.key === key);
    const picked = sec.querySelector('label.opt input:checked');
    const opt = q.options?.find((o) => o.id === picked?.value);
    answers[key] = { title: q.title, pick: picked?.value ?? null, pickLabel: opt?.label ?? null, note: sec.querySelector('textarea').value.trim() };
    if (q.rows) { const rows = {}; for (const el of sec.querySelectorAll('.row')) rows[el.dataset.row] = el.querySelector('input:checked')?.value ?? null; answers[key].rows = rows; }
  }
  return { id: Q.id, savedAt: new Date().toISOString(), answers };
}

function count() {
  const all = Q.questions.filter((q) => q.options?.length).length;
  const done = [...document.querySelectorAll('.q')].filter((s) => s.querySelector('label.opt input:checked')).length;
  const st = $('#status');
  if (!st.classList.contains('done')) st.textContent = all ? `고른 것 ${done} / ${all} · 안 고른 것은 "아직"으로 남습니다` : '바꿀 줄만 누르고 저장하세요 · 중간에 저장해도 다시 열면 이어집니다';
}

document.addEventListener('change', count);
$('#save').addEventListener('click', async () => {
  const st = $('#status');
  try {
    const r = await fetch('/save', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(collect()) });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error);
    st.className = 'done';
    st.textContent = `저장했습니다 → ${j.path} · 이 창은 닫으셔도 됩니다. 설계 창에 "결정 저장했어"라고만 말씀해 주세요.`;
    $('#save').disabled = true;
  } catch (e) {
    st.className = 'err';
    st.textContent = '저장하지 못했습니다 — decide.bat 을 다시 눌러 연 뒤 저장해 주세요. (' + e.message + ')';
  }
});

(async () => {
  try {
    Q = await (await fetch('/questions')).json();
    const saved = await (await fetch('/saved')).json();
    render(saved && saved.id === Q.id ? saved : null);
  } catch (e) {
    $('#lead').textContent = '이 파일을 직접 열면 저장이 안 됩니다. 저장소 맨 위의 decide.bat 을 두 번 눌러 열어 주세요.';
    $('#save').disabled = true;
  }
})();
</script>
</body>
</html>
