<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="퀴즈도장">
  <!-- 퀴즈도장 공식 로고 (찬종 2026-11-20 확정 · "4번 — 도장 손잡이 꼬리"). 바탕 = 둥근 네모 · 보라→분홍 가로 번짐 · 흰 테두리 · 왼쪽 6도 기울임. Q = 흰 고리 + 막대 + 둥근 꼭지(위에서 본 도장). 값을 바꾸지 않는다. -->
  <defs><linearGradient id="qd" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8a6bff"/><stop offset="1" stop-color="#ff7eb3"/></linearGradient></defs>
  <g transform="rotate(-6 256 256)">
    <rect x="66" y="66" width="380" height="380" rx="118" fill="url(#qd)"/>
    <rect x="100" y="100" width="312" height="312" rx="88" fill="none" stroke="#fff" stroke-width="20"/>
    <circle cx="236" cy="236" r="74" fill="none" stroke="#fff" stroke-width="42"/>
    <line x1="286" y1="286" x2="322" y2="322" stroke="#fff" stroke-width="36" stroke-linecap="round"/>
    <circle cx="338" cy="338" r="32" fill="#fff"/>
  </g>
</svg>
