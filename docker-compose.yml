# 로컬 개발용 PostgreSQL.
# ★ 포트 5434를 쓰는 이유: 이 PC에 다른 프로젝트의 PostgreSQL이 5432/5433을 쓰고 있어
#   충돌을 피한다. 변경하려면 .env 의 DATABASE_URL도 함께 고쳐야 한다.
services:
  db:
    image: postgres:17-alpine
    container_name: quiz-web-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: quiz
      # ★ R107 (D-367) — 값은 .env 의 POSTGRES_PASSWORD(없으면 옛 값). ★ 이 값은 **볼륨을 처음 만들 때만** 쓰인다 —
      #   지금 DB 의 비밀번호를 바꾸려면 docs/11-DEPLOY.md "DB 비밀번호 바꾸기" 순서(ALTER USER → .env 두 줄)
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quizlocal}
      POSTGRES_DB: quizweb
      # 한국어 정렬·비교를 위한 로케일 설정
      LANG: ko_KR.utf8
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    # ★ R107 (D-367) — 이 PC 안에서만(127.0.0.1). 옛 "5434:5432" 는 모든 주소에 열려 같은 공유기의 다른 기기도 붙을 수 있었다
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - quiz-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quiz -d quizweb"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  quiz-db-data:
