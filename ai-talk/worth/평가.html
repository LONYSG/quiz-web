<script>const D=[{"id":2910,"grade":3,"answer":"광안리","after":{"question":"2004년 프로리그 결승에 10만 명이 모였다고 전해져 e스포츠 대중화의 상징이 된 부산의 해수욕장은 어디일까요?","hint":"부산불꽃축제가 열리는 바닷가로, 바다를 가로지르는 큰 다리의 밤 조명이 이름났습니다.","explanation":"이 결승은 \"광안리 대첩\" 이라고도 불립니다."},"before":null},{"id":7097,"grade":1,"answer":"스포트라이트","after":{"question":"공연장에서 무대 위 한 사람만 좁고 강한 빛으로 동그랗게 비추는 조명은 무엇일까요?","hint":"일상에서는 ‘세상의 주목을 받는다’는 뜻으로 ‘~를 받다’라고도 씁니다.","explanation":"영어로 ‘점’과 ‘빛’을 합쳐 만든 이름입니다."},"before":{"question":"공연장에서 쓰는 조명 장비입니다. 무대 위 한 사람만 좁고 강한 빛으로 동그랗게 비춥니다. 일상에서는 '세상의 주목을 받는다'는 뜻으로 '~를 받다'라고도 씁니다. 이 조명은?","hint":"무대에서 주인공 한 명만 한 줄기 빛으로 따라가며 비추는 무대 장비로, 콘서트와 연극의 클라이맥스에 쓴다.","explanation":"영어로 '점'과 '빛'을 합친 말로, 원래 극장 장비 이름이던 것이 1910년대부터 '세상의 관심'이라는 비유로도 쓰였다고 합니다."}},{"id":7378,"grade":3,"answer":"로 대 웨이드","after":{"question":"1973년 미국 연방대법원이 7대 2로 내린 판결로, 소송을 낸 텍사스 여성의 가명과 댈러스 지방검사의 성을 이어 이름 붙였습니다. 2022년 돕스 판결로 뒤집힌 이 판결은 무엇일까요?","hint":"미국 헌법이 임신 중단을 고를 여성의 권리를 보호한다고 본 판결로, 반세기 동안 미국 낙태 논쟁의 한가운데 있었습니다.","explanation":"매코비는 판결 전에 아이를 낳아 입양 보냈습니다. 뒤에 낙태 반대 운동에 나섰지만, 죽기 전 다큐멘터리에서 돈을 받고 한 일이었다고 털어놓았습니다."},"before":{"question":"1973년 1월 미국 연방대법원이 7대 2로 내린 한 판결이 있습니다. 소송을 낸 텍사스 여성 노마 매코비는 신원을 감추려 법정용 가명을 썼고, 상대는 댈러스 카운티 지방검사였습니다. 판결 이름은 그 가명의 성과 검사의 성을 이은 것입니다. 2022년 돕스 판결로 뒤집힌 이 판결은?","hint":"미국 헌법이 임신을 중단할지 고를 여성의 권리를 보호한다고 본 판결로, 반세기 동안 미국 낙태 논쟁의 한가운데 있었다.","explanation":"매코비는 판결 전에 아이를 낳아 입양 보냈습니다. 뒤에 낙태 반대 운동에 나섰지만, 죽기 전 다큐멘터리에서 돈을 받고 한 일이었다고 털어놓았습니다."}},{"id":2789,"grade":2,"answer":"개인혼영","after":{"question":"수영에서 한 선수가 접영·배영·평영·자유형 순서로 네 영법을 모두 헤엄치는 종목은 무엇일까요?","hint":"한국의 김서영이 2018 아시안게임에서 금메달을 딴 수영 종목으로, 올림픽에서는 200m와 400m가 열립니다.","explanation":"혼계영에서 네 명이 영법을 나눠 헤엄칠 때는 순서가 배영부터입니다."},"before":null},{"id":3939,"grade":4,"answer":"파프리카","after":{"question":"헝가리 과학자 센트죄르지는 세게드의 특산물에서 비타민 C를 대량으로 뽑아 노벨상 연구의 밑거름으로 삼았습니다. 이 채소는 무엇일까요?","hint":"맵지 않고 단맛이 강한 열매 채소로, 말려 빻은 가루는 헝가리 고기 스튜 굴라시의 빨간 양념이 됩니다.","explanation":"고추 무리 열매는 레몬보다 비타민 C가 훨씬 많아 연구 재료로 안성맞춤이었다고 합니다."},"before":null},{"id":605,"grade":2,"answer":"근호","after":{"question":"제곱근을 나타낼 때 쓰며, 라틴어로 뿌리를 뜻하는 말의 첫 글자에서 모양이 나왔다고 하는 수학 기호는 무엇일까요?","hint":"계산기에 2를 넣고 이 단추를 누르면 1.414…가 나옵니다. 직각삼각형의 빗변 길이를 구할 때도 만나는 기호입니다.","explanation":"기호 위의 가로줄이 어디까지 이어지는지를 보면 제곱근을 취하는 범위를 알 수 있습니다."},"before":{"question":"제곱해서 그 수가 되는 값을 나타내는 기호로, 뿌리를 뜻하는 라틴어의 첫 글자에서 모양이 왔다고 전해지는 것은?","hint":"계산기에서 2 를 넣고 이 단추를 누르면 1.414… 가 나오며, 직각삼각형 빗변을 구할 때 늘 따라붙는 기호다.","explanation":"근호, 흔히 루트라고 부릅니다. 위에 그은 가로줄은 어디까지가 그 기호 안인지를 나타냅니다."}},{"id":6503,"grade":3,"answer":"샤라포바","after":{"question":"소치에서 자란 한 소녀는 여섯 살 때 나브라틸로바에게 미국 훈련을 권유받았습니다. 아버지와 700달러를 들고 플로리다로 건너간 이 테니스 선수는 누구일까요?","hint":"2004년 17살에 첫 메이저 대회 정상에 오른 러시아 테니스 스타로, 2016년 금지 약물 양성으로 자격 정지를 받기도 했습니다.","explanation":"비자 문제로 어머니는 2년 동안 미국에 오지 못했고, 아버지는 여러 허드렛일로 딸의 레슨비를 댔습니다."},"before":null},{"id":2961,"grade":3,"answer":"의성","after":{"question":"추운 곳에서 자라 알이 단단하고 매운맛이 강한 한지형 마늘로 이름난 경상북도의 군은 어디일까요?","hint":"국내 첫 컬링 전용 경기장이 있어 평창 올림픽 여자 컬링 ‘팀 킴’을 길러 낸 경북의 군입니다.","explanation":"따뜻한 남쪽에서 기르는 난지형 마늘과 구별됩니다."},"before":{"question":"추운 지역에서 자라 알이 단단하고 매운맛이 강한 한지형 마늘로 이름난 경상북도의 군은?","hint":"국내 첫 컬링 전용 경기장이 있어 평창 올림픽 여자 컬링 '팀 킴' 을 길러 낸 경북의 군이다.","explanation":"따뜻한 남쪽에서 기르는 난지형 마늘과 구별됩니다."}},{"id":5438,"grade":3,"answer":"서동요","after":{"question":"백제 왕후를 사택적덕의 딸로 기록한 사리 봉안 기록이 발견되자, 무왕과 선화공주의 결혼 이야기가 후대에 꾸며졌다는 주장이 나왔습니다. 이 결혼 설화가 딸린 향가는 무엇일까요?","hint":"백제 무왕이 소년 시절 선화공주를 얻으려 지어 아이들에게 부르게 했다고 전하는 4구체 향가입니다.","explanation":"기록은 사리함 자체의 글이 아니라, 2009년 미륵사지 서탑에서 함께 나온 금판 ‘금제사리봉영기’에 새겨져 있습니다."},"before":{"question":"백제 왕후가 좌평 사택적덕의 딸이라고 적힌 한 사리 봉안 기록이 확인되었습니다. 그래서 어느 향가의 배경 설화 속 결혼이 후대에 꾸며진 허구라는 주장이 나왔습니다. 이 향가는?","hint":"백제 무왕이 소년 시절 신라 선화공주를 얻으려 지어 아이들에게 부르게 했다고 전하는, 가장 오랜 꼴의 4구체 향가다.","explanation":"이 기록은 2009년 익산 미륵사지 석탑을 해체하다 나온 금동사리함 명문입니다."}},{"id":4092,"grade":3,"answer":"군주","after":{"question":"1998년 엔씨소프트가 내놓은 ‘리니지’에서 혈맹을 만들 수 있는 유일한 클래스는 무엇일까요?","hint":"혈맹원을 거느리고 성을 차지하려는 대규모 싸움을 이끄는 왕자·공주 캐릭터입니다.","explanation":"후속작 '리니지 2'에는 군주 전용 클래스가 따로 없습니다."},"before":null},{"id":2651,"grade":2,"answer":"동물농장","after":{"question":"농장 동물들이 혁명을 일으켰다가 결국 처음의 지배자와 구별되지 않게 되는 과정을 그린 조지 오웰의 우화 소설은 무엇일까요?","hint":"돼지 지도자가 경쟁자 스노볼을 쫓아내고 독재자가 되는 우화로, 소련 스탈린 체제를 빗댔습니다.","explanation":"처음의 평등한 구호는 나중에 일부 동물이 다른 동물보다 더 평등하다는 모순된 문장으로 바뀝니다."},"before":{"question":"농장 동물들이 혁명을 일으켰다가 결국 처음의 지배자와 구별되지 않게 되는 과정을 그린 오웰의 우화 소설은?","hint":"돼지 지도자가 경쟁자 스노볼을 쫓아내고 독재자가 되는 우화로, 소련 스탈린 체제를 빗댔다.","explanation":"'모든 동물은 평등하다' 는 구호가 바뀌는 장면이 핵심입니다."}},{"id":844,"grade":3,"answer":"에탄올","after":{"question":"술에 들어 있는 알코올로, 소독에 쓸 때는 순수한 것보다 물을 섞어 70퍼센트 정도로 낮춰 쓰는 것은 무엇일까요?","hint":"곡식과 과일의 당이 발효하며 생기는 알코올로, 맥주를 비롯한 여러 술에 든 성분입니다.","explanation":"물이 함께 있으면 단백질 변성이 더 잘 일어납니다. 순수 알코올보다 물을 섞은 쪽의 살균력이 나을 수 있는 까닭입니다."},"before":{"question":"술에 들어 있는 알코올로, 소독용으로 쓸 때는 순수한 것보다 오히려 물을 섞어 70퍼센트쯤으로 낮춰 쓰는 것은?","hint":"곡식과 과일의 당이 발효하며 생기는 알코올로, 맥주를 비롯한 여러 술에 든 바로 그 성분이다.","explanation":"너무 진하면 세균 겉만 굳혀 버려 안쪽까지 스며들지 못합니다."}},{"id":1122,"grade":4,"answer":"직접압박법","after":{"question":"출혈이 있는 상처를 깨끗한 천이나 거즈로 세게 눌러 피를 멎게 하는 기본 지혈 방법은 무엇일까요?","hint":"거즈를 댄 손에 계속 힘을 주는 방식으로, 피가 배어 나와도 처음 댄 거즈는 떼지 않습니다.","explanation":"지혈대를 무조건 마지막 수단으로 미루지는 않습니다. 팔·다리에서 생명을 위협하는 출혈이 나면, 사용법을 익힌 사람은 지혈대를 쓸 수 있습니다."},"before":{"question":"출혈이 있을 때 가장 먼저 권장되는 지혈 방법으로, 깨끗한 천으로 상처를 직접 세게 눌러 피를 멎게 하는 것은?","hint":"거즈 위로 피가 배어 나와도 떼지 말고 새 거즈를 덧대어 10분 넘게 꾹 누르는 것이 요령인 기본 지혈법이다.","explanation":"지혈대로 위쪽을 묶는 방법은 조직이 상할 수 있어 마지막 수단으로 씁니다."}},{"id":2732,"grade":3,"answer":"25","after":{"question":"배구에서는 동점일 때 2점 차가 나야 세트가 끝납니다. 마지막 5세트를 제외한 세트에서, 이 조건을 만족하면서 먼저 얻어야 하는 최소 점수는 몇 점일까요?","hint":"1999년 국제배구연맹이 랠리마다 점수를 주는 방식으로 바꾸며 1~4세트의 승리 점수로 정한 수입니다.","explanation":"마지막 5세트의 기준은 15점입니다. 여기서도 2점 차가 나야 끝납니다."},"before":{"question":"배구에서 마지막 5세트가 아닌 세트를 따려면 먼저 몇 점을 얻어야 합니까? 동점 상황에서는 2점을 앞서야 끝납니다.","hint":"1999년 국제배구연맹이 랠리마다 점수를 주는 방식으로 바꾸며 1~4세트의 승리 점수로 정한 수다.","explanation":"5세트는 15점을 먼저 얻는 쪽이 이깁니다."}},{"id":4497,"grade":3,"answer":"문경지교","after":{"question":"조나라 장군 염파는 인상여를 모욕하려 했지만, 인상여는 나라를 먼저 생각해 그를 피했습니다. 속뜻을 안 염파가 사죄하고 두 사람이 막역한 벗이 된 데서 나온 사자성어는 무엇일까요?","hint":"죽음도 함께할 수 있을 만큼 두터운 벗 사이를 이르는, 우정을 뜻하는 사자성어입니다.","explanation":"염파가 웃통을 벗고 가시나무를 진 채 찾아가 사죄한 데서 ‘부형청죄’라는 말도 나왔습니다. ‘사기’ 염파·인상여열전에 실린 이야기입니다."},"before":{"question":"조나라 장군 염파는 말재주로 자기보다 높은 자리에 오른 인상여를 모욕하겠다고 별렀습니다. 그러나 인상여는 나라를 먼저 생각해 염파를 피했습니다. 그 속뜻을 들은 염파는 사죄했고, 두 사람은 막역한 벗이 되었습니다. 이 두 사람의 사귐에서 나온 사자성어는?","hint":"죽음도 함께할 수 있을 만큼 두터운 벗 사이를 이르는, 우정을 뜻하는 대표 사자성어다.","explanation":"염파가 웃통을 벗고 가시나무를 진 채 찾아가 사죄한 데서 '부형청죄'라는 말도 함께 나왔다. '사기' 염파·인상여열전에 실린 이야기다."}},{"id":7091,"grade":3,"answer":"역슬래시","after":{"question":"한국어 윈도에서 파일 경로가 ‘C:₩Users’처럼 보이는 것은 옛 문자 규격이 한 기호 자리에 원화 기호를 넣었기 때문입니다. 원래 이 자리에 있던 기호의 이름은 무엇일까요?","hint":"왼쪽 위에서 오른쪽 아래로 비스듬히 그은 기호로, 프로그래밍에서는 줄바꿈 같은 특수 문자를 나타낼 때 앞에 붙입니다.","explanation":"1961년 밥 베머가 ASCII 위원회에 제안해 넣었고, 일본 규격은 같은 자리에 엔화 기호(¥)를 넣었습니다."},"before":null},{"id":6338,"grade":4,"answer":"올인","after":{"question":"2003년 SBS 드라마로, 프로 바둑기사 출신 카지노 사업가 차민수를 주인공의 모델로 삼았습니다. 진구와 한지민이 두 주인공의 아역을 맡은 이 드라마는 무엇일까요?","hint":"이병헌과 송혜교가 주연한 카지노 도박사의 사랑과 승부 이야기로, 이병헌은 이 작품으로 SBS 연기대상을 받았습니다.","explanation":"주인공의 맞수 최정원 역은 지성이 맡았습니다."},"before":null},{"id":298,"grade":2,"answer":"수경재배","after":{"question":"흙을 사용하지 않고 물과 영양액으로 식물을 키우는 원예 재배 방식은 무엇일까요?","hint":"채소와 과일을 실내 선반에 층층이 기르는 수직 농장에서 흙 대신 쓰는 기르기 방법입니다.","explanation":"뿌리도 산소가 필요합니다. 물에 잠긴 뿌리가 숨 막히지 않도록 영양액에 공기를 공급하는 것이 중요합니다."},"before":null},{"id":1945,"grade":3,"answer":"트레드","after":{"question":"빗길에서 물을 밀어내 타이어가 노면에 닿게 해 주며, 닳으면 미끄러지기 쉬워지는 부분입니다. 타이어 바깥 고무 면에 홈과 무늬가 새겨진 부분은 무엇일까요?","hint":"100원 동전을 이순신 머리가 아래로 가게 꽂아 감투가 다 보이면 갈 때라고 보는, 타이어의 홈이 있는 면입니다.","explanation":"깊이가 1.6밀리미터 아래로 닳으면 교체해야 한다고 정해져 있습니다."},"before":null},{"id":2120,"grade":2,"answer":"숲","after":{"question":"나무가 대기의 이산화탄소를 흡수해 줄기와 흙에 탄소를 쌓아 두는 육상 생태계는 무엇일까요?","hint":"피톤치드를 마시며 산책하러 가는, 나무가 우거진 곳입니다.","explanation":"나무가 불에 타면 저장돼 있던 탄소가 이산화탄소로 대기에 돌아갑니다. 산불은 탄소 순환의 흐름도 바꾸는 셈입니다."},"before":null},{"id":2440,"grade":2,"answer":"모르핀","after":{"question":"양귀비에서 얻은 성분으로, 강력한 진통 효과가 있지만 중독성 때문에 엄격히 관리되는 약은 무엇일까요?","hint":"수술 뒤나 말기 암 환자의 극심한 고통에 쓰는 대표 마약성 진통제로, 전쟁 영화에서 부상병에게 놓는 주사로 자주 나옵니다.","explanation":"꿈의 신의 이름에서 유래했다고 설명됩니다."},"before":null},{"id":3712,"grade":4,"answer":"하녀","after":{"question":"봉준호가 ‘기생충’에 큰 영향을 준 작품으로 꼽은 김기영의 1960년 영화입니다. 2층 양옥집의 계단과 쥐약이 파국의 도구가 되는 이 작품은 무엇일까요?","hint":"피아노 레슨을 하는 음악 선생 집에 들어온 젊은 여자가 주인 남자와 얽히며 가정이 무너지는 이야기입니다.","explanation":"김기영은 뒤에 ‘화녀’와 ‘화녀 ’82’를 만들어 세 작품을 묶어 부르는 3부작을 이루었습니다."},"before":null},{"id":3520,"grade":3,"answer":"이오지마","after":{"question":"1945년 수리바치산에 성조기를 세우는 유명한 사진은 작은 깃발을 더 큰 것으로 바꾸는 장면이었습니다. 이 일이 있었던 섬은 어디일까요?","hint":"1945년 2~3월 미군과 일본군이 땅굴 진지를 두고 한 달 넘게 싸운, 도쿄 남쪽의 작은 화산섬입니다.","explanation":"이 섬의 전투는 클린트 이스트우드 감독이 미국과 일본 양쪽의 시선으로 나눠 2006년 영화 두 편에 담았습니다."},"before":null},{"id":1839,"grade":2,"answer":"니체","after":{"question":"절대적 가치의 근거가 무너진 시대를 진단하며 ‘신은 죽었다’고 선언한 독일 철학자는 누구일까요?","hint":"‘차라투스트라는 이렇게 말했다’와 ‘선악의 저편’을 쓴 19세기 사상가로, 말년에 정신 쇠약으로 쓰러졌습니다.","explanation":"‘즐거운 학문’에서는 밝은 아침에 등불을 켜고 신을 찾아다니는 ‘광인’의 이야기 속에 이 선언이 등장합니다."},"before":null},{"id":6378,"grade":3,"answer":"마카다미아","after":{"question":"호주가 원산지인 견과로, 개가 먹으면 떨림이나 고열이 생기고 뒷다리에 힘이 빠질 수 있는 것은 무엇일까요?","hint":"2014년 ‘땅콩 회항’ 사건 때 땅콩 대신 봉지째 나와 문제가 된 고소한 견과입니다.","explanation":"이 중독의 정확한 원리는 아직 밝혀지지 않았습니다. 전문 수의학 자료에서 임상 증상이 보고된 동물은 개라고 설명합니다."},"before":{"question":"오스트레일리아 토박이 식물 가운데 널리 기르는 유일한 식량 작물인 견과가 있습니다. 이 견과는 고양이에게 떨림, 마비, 관절 경직, 고열을 일으킬 수 있지만, 무엇이 독성을 내는지는 알려져 있지 않습니다. 이 견과는?","hint":"2014년 '땅콩 회항' 사건 때 땅콩이 아니라 실제로 봉지째 나와 문제가 된 고소한 견과다.","explanation":"개가 먹으면 12시간 안에 뒷다리에 힘이 빠져 일어서지 못하기도 하지만, 대개 24~48시간 안에 완전히 회복됩니다."}},{"id":6391,"grade":4,"answer":"나폴레옹 법전","after":{"question":"1800년 포르탈리스 등이 초안을 맡았고, 스탕달은 꾸밈없는 문체의 본보기로 삼았다고 합니다. 1804년 프랑스에서 제정된 법전은 무엇일까요?","hint":"황제에 오른 코르시카 출신 군인의 이름이 붙은 법으로, 근대 유럽 여러 나라의 법에 큰 영향을 주었습니다.","explanation":"미국 루이지애나주는 프랑스·스페인 법 전통의 영향을 강하게 받아 민법이 다른 주와 다릅니다."},"before":null},{"id":5571,"grade":4,"answer":"대배심","after":{"question":"잉글랜드에서 유래했지만 그곳에서는 폐지됐고, 미국에는 남아 있는 시민 참여 기구입니다. 연방의 중죄 사건에서 검사의 증거를 살펴 기소 여부를 판단하는 16~23명의 +'<div><span class="l">질문</span>'+esc(c.after.question)+'</div><div><span class="l">정답</span><span class="a">'+esc(c.answer)+'</span></div>'
+'<div><span class="l">힌트</span>'+esc(c.after.hint)+'</div><div><span class="l">해설</span>'+esc(c.after.explanation)+'</div>'
+(c.before?'<div class="b"><b>고치기 전</b><br><span class="l">질문</span>'+esc(c.before.question)+'<br><span class="l">힌트</span>'+esc(c.before.hint)+'<br><span class="l">해설</span>'+esc(c.before.explanation)+'</div>':'')
+'<div>'+L.map(([k,v])=>'<button class="btn" data-k="'+k+'">'+v+'</button>').join('')+(c.before?'<label style="margin-left:10px;font-size:13px"><input type="checkbox" class="worse"> 고치기 전이 더 낫다</label>':'')+'</div><input type="text" placeholder="하고 싶은 말(선택)">';
d.querySelectorAll('.btn').forEach(b=>b.onclick=()=>{d.querySelectorAll('.btn').forEach(x=>x.classList.remove('on'));b.classList.add('on');d.classList.add('done');R[c.id]=Object.assign(R[c.id]||{},{worth:b.dataset.k});upd()});
d.querySelector('input[type=text]').oninput=e=>{R[c.id]=Object.assign(R[c.id]||{},{memo:e.target.value})};const w=d.querySelector('.worse');if(w)w.onchange=e=>{R[c.id]=Object.assign(R[c.id]||{},{beforeBetter:e.target.checked})};list.appendChild(d)});
function upd(){document.getElementById('cnt').textContent=Object.values(R).filter(x=>x.worth).length+' / 30'}
document.getElementById('save').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(R,null,1)],{type:'application/json'}));a.download='평가-결과.json';a.click()};</script></html>
